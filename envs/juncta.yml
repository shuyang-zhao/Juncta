# Database, search and statistics. Sage 0.14.7 from bioconda reports itself as 0.14.6.
name: juncta
channels: [conda-forge, bioconda]
dependencies:
  - python=3.11
  - pandas=3.1.0
  - numpy=2.4.6
  - scipy=1.17.1
  - pyarrow=25.0.0
  - pyahocorasick=2.3.1
  - pysam=0.24.1
  - pyyaml=6.0.3
  - sage-proteomics=0.14.7
  - thermorawfileparser=1.4.5
  - openjdk=17
  - pytest
